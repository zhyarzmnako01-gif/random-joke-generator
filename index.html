<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-card">
            <h1>🎭 Random Joke Generator</h1>
            
            <div class="controls">
                <select id="categorySelect">
                    <option value="any">Any Category</option>
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock Knock</option>
                </select>
                <button id="getJokeBtn" class="btn-primary">Get a Joke</button>
                <button id="copyBtn" class="btn-secondary">Copy</button>
            </div>

            <div class="joke-display" id="jokeDisplay">
                <p id="jokeText">Click "Get a Joke" to start!</p>
            </div>

            <div class="joke-info">
                <span id="jokeType"></span>
                <span id="jokeId"></span>
            </div>

            <div class="loading" id="loadingSpinner" style="display: none;">
                <div class="spinner"></div>
                <p>Loading joke...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
